<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teach | Command Center</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 5px; overflow: hidden; height: 100vh; 
            background-color: #0f172a; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(109, 40, 217, 0.4) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); }
        
        .site-logo { position: fixed; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 50px; background: rgba(255,255,255,0.9); z-index: 99999; }
        .site-logo img { width: 30px; height: 30px; border-radius: 50%; }
        .site-logo span { font-weight: bold; color: #333; }
        
        .nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 5px; padding: 8px; align-items: center; margin-left: 140px; position: relative; z-index: 10000; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 180px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); z-index: 100000; top: 100%; left: 0; overflow: hidden; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; border-bottom: 1px solid #eee; }

        .board-container { display: grid; grid-template-columns: 1.2fr 0.8fr; grid-template-rows: 78vh; gap: 12px; padding: 0 10px; transition: 0.3s; }
        .panel { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.4); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        textarea { width: 100%; height: 100%; border: none; padding: 20px; font-size: 16px; outline: none; background: #fffde7; }

        .avatar-zone { position: fixed; bottom: 16vh; left: 25px; z-index: 999; pointer-events: none; }
        .avatar-gif { width: 100px; height: 100px; object-fit: contain; }

        .bottom-bar { display: flex; justify-content: center; gap: 12px; margin-top: 8px; height: 12vh; }
        .widget { width: 180px; padding: 8px; text-align: center; color: white; overflow-y: auto; }
        .leader-item { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        button, select, input { padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
                
        #timer-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:999999; justify-content:center; align-items:center; flex-direction:column; }
        #timer-display-huge { font-size: 120px; font-weight: bold; color: #ffeb3b; font-family: monospace; }
        .flipping { animation: flip 2s infinite; }
        @keyframes flip { 0% { transform: rotate(0); } 50% { transform: rotate(180deg); } 100% { transform: rotate(180deg); } }
    </style>
</head>
<body>
    <div id="timer-modal">
        <div id="hourglass-icon" style="font-size: 80px; margin-bottom: 10px;">⏳</div>
        <div id="timer-display-huge">00:00</div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button id="pause-btn" style="background:#f39c12; color:white; padding:15px 30px;" onclick="pauseTimer()">⏸ PAUSE</button>
            <button style="background:#dc3545; color:white; padding:15px 30px;" onclick="quitTimer()">❌ QUIT</button>
        </div>
    </div>

    <div class="site-logo"><img src="/static/images/TeachLogo2.jpeg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3426/3426653.png'"><span>Teach.</span></div>

    <div class="nav glass">
        <select id="class-selector" onchange="window.location.href='/?class_id=' + this.value">
            <option value="">-- Class --</option>
            {% for c in classrooms %}<option value="{{ c.id }}" {% if selected_class_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
        <div class="dropdown"><button style="background:#8e44ad; color:white;">🪑 Manage ▾</button>
        <div class="dropdown-content">
            <a href="#" onclick="goBehavior()">Behavior Tool</a>
            <a href="/roster">Class Record</a>
            <a href="/settings">Library & Settings</a>
        </div></div>
        <button onclick="changeView('content')" style="background:#fff;">📄 Lesson</button>
        <button onclick="changeView('split')" style="background:#fff;">🌓 Split</button>
        <div style="background:white; border-radius:8px; display:flex; padding:2px 5px;"><input type="text" id="yt-link" placeholder="Paste Link..." style="border:none; width:120px;"><button style="background:red; color:white; font-size:9px;" onclick="castYoutube()">CAST</button></div>
        <button onclick="location.href='/logout'" style="background:#333; color:white;">🚪 Logout</button>
    </div>

    <div class="board-container" id="board">
        <div class="panel" id="lp"><iframe id="pdf-viewer" allowfullscreen="true"></iframe></div>
        <div class="panel" id="rp"><textarea placeholder="Start typing lesson notes..."></textarea></div>
    </div>

    <div class="avatar-zone"><img id="ai-instr" src="/static/images/teacher-avatar.gif" class="avatar-gif"></div>

    <div class="bottom-bar">
        <div class="widget glass">🏆 Rankings<br>{% for s in top_students %}<div class="leader-item"><span>{{ s.name }}</span><b>{{ s.points }}</b></div>{% endfor %}</div>
        <div class="widget glass">👤 Picker<div id="picked-name" style="font-weight:bold; margin:5px; font-size: 14px;">---</div><button onclick="pickStudent()" style="width:100%; font-size:10px; background:#fff;">PICK</button></div>
        <div class="widget glass"><span>⏱️ Timer</span><div style="display:flex; gap:2px; margin-bottom:5px; justify-content:center;"><input type="number" id="t-min" style="width:40px;" value="05">m <input type="number" id="t-sec" style="width:40px;" value="00">s</div><button onclick="initTimer()" style="width:100%; background:#fab005; font-size:10px; color:black;">LAUNCH</button></div>
        <div class="widget glass">📚 Library<br><select id="lib-select" onchange="loadPDF(this.value)" style="width:100%; font-size:9px; margin-top:5px;"><option value="">Select...</option>{% for doc in documents %}<option value="{{ doc.filename }}">{{ doc.filename[:18] }}</option>{% endfor %}</select></div>
        <div class="widget glass">📊 Report<br><button onclick="downloadCSV()" style="background:#2ecc71; color:white; font-size:10px; width:100%; margin-top:5px;">📥 CSV</button></div>
    </div>

    <script>
        window.onload = function() { const av = document.getElementById('ai-instr'); av.src = av.src + "?t=" + new Date().getTime(); };
        
        function changeView(v) { const b = document.getElementById('board'); const r = document.getElementById('rp'); if(v==='content') { b.style.gridTemplateColumns="1fr"; r.style.display="none"; } else { b.style.gridTemplateColumns="1.2fr 0.8fr"; r.style.display="block"; } }
        function castYoutube() { 
            const inputUrl = document.getElementById('yt-link').value; 
            const viewer = document.getElementById('pdf-viewer');
            let finalUrl = inputUrl;
            if(inputUrl.includes("docs.google.com/presentation")) { 
                finalUrl = inputUrl.split("/edit")[0].split("/view")[0] + "/embed?start=false&loop=false"; 
            } else if(inputUrl.includes("v=")) { 
                finalUrl = "https://www.youtube.com/embed/" + inputUrl.split("v=")[1].split("&")[0]; 
            }
            viewer.src = finalUrl; 
        }

        function loadPDF(f) { if(f) { document.getElementById('pdf-viewer').src = '/static/uploads/' + f; } }

        let t_clock, totalS = 0, isPaused = false;
        function initTimer() {
            const m = parseInt(document.getElementById('t-min').value) || 0;
            const s = parseInt(document.getElementById('t-sec').value) || 0;
            totalS = (m * 60) + s; if (totalS <= 0) return;
            isPaused = false; document.getElementById('timer-modal').style.display = 'flex';
            document.getElementById('hourglass-icon').classList.add('flipping');
            updateTimerUI(); clearInterval(t_clock);
            t_clock = setInterval(() => {
                if (!isPaused) {
                    totalS--; updateTimerUI();
                    if (totalS <= 0) { clearInterval(t_clock); alert("Time up!"); quitTimer(); }
                }
            }, 1000);
        }
        function updateTimerUI() { let m = Math.floor(totalS / 60), s = totalS % 60; document.getElementById('timer-display-huge').innerText = String(m).padStart(2,'0')+":"+String(s).padStart(2,'0'); }
        function pauseTimer() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? "▶ RESUME" : "⏸ PAUSE"; }
        function quitTimer() { clearInterval(t_clock); document.getElementById('timer-modal').style.display = 'none'; }
        function goBehavior() { const id = document.getElementById('class-selector').value; if(id) window.location.href='/manage_behavior/'+id; else alert('Select class!'); }
        function pickStudent() { 
            const id = document.getElementById('class-selector').value; 
            if(id) { fetch('/pick_name/'+id).then(r=>r.json()).then(d=>document.getElementById('picked-name').innerText=d.name); }
            else { alert('Select a class first!'); }
        }

        function downloadCSV() {
            let classId = document.getElementById('class-selector').value;
            if (!classId || classId === "") {
                const urlParams = new URLSearchParams(window.location.search);
                classId = urlParams.get('class_id');
            }
            if (classId) { window.location.href = '/export_roster/' + classId; }
            else { alert("Please select a class from the dropdown first."); }
        }
    </script>
</body>
</html>
